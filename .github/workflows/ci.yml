# Main CI pipeline. Required status checks for branch protection are listed in docs/ops/CI.md.
# Third-party actions are pinned by commit SHA (version in the trailing comment); Dependabot updates them.
name: ci

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tag build half-way through a push.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  backend:
    name: Backend (mvn verify, JaCoCo gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Java 21 = <java.version> in pom.xml.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests, Testcontainers integration tests (Docker is available on the runner), ArchUnit, the OpenAPI
      # drift check, and the JaCoCo coverage rule on auth/security/ipaccess/ingestion (jacoco:check fails the build).
      - name: mvn verify
        run: ./mvnw -B -ntp verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore

  attacks:
    name: Attacker-mode suite (JUnit tag attack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # src/test/java/com/educore/attacks/**: excluded from the default build (pom.xml excludedGroups) and run
      # here on their own. A failing test means an attack succeeded (each test's Javadoc describes the attack and the expected defence). Coverage
      # of this partial run is not meaningful, so the JaCoCo gate stays in the backend job.
      - name: mvn verify (attack group only)
        run: ./mvnw -B -ntp verify -Dgroups=attack -DexcludedGroups= -Djacoco.skip=true

      - name: Upload attack test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attack-test-reports
          path: target/failsafe-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, typecheck, test, build, Lighthouse)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (lockfile only)
        run: npm ci --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unit and component tests run against mocked HTTP (msw); no backend is needed.
      - name: Unit tests
        run: npm test

      # Production build against the bundled mock public API (no backend in this job): prerendering, SEO checks
      # (check-seo) and the prerender tests. The real-catalog build happens on the deployment host
      # (docker-compose.prod.yml) and fails there when no course is published.
      - name: Build (mock public API)
        run: npm run build:mock

      # Budgets and assertions: frontend/lighthouserc.cjs (performance >= 0.9, SEO/a11y/best practices >= 0.95,
      # LCP <= 2.5 s, CLS <= 0.1) on /, /courses and one course page, served by scripts/serve-dist.mjs.
      - name: Lighthouse CI
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run lighthouse

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse
          path: frontend/dist/lighthouse
          if-no-files-found: ignore

  security:
    name: Security (gitleaks, Trivy, npm audit, SBOMs, image scans)
    uses: ./.github/workflows/supply-chain.yml
    permissions:
      contents: read

  e2e:
    name: End-to-end (compose stack, Playwright)
    needs: [backend, frontend, attacks]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Throwaway secrets for this job only; generated, never printed, removed in the last step.
      - name: Write ephemeral .env
        run: |
          umask 077
          {
            echo "SPRING_PROFILES_ACTIVE=dev"
            echo "EDUCORE_DB_NAME=educore_db"
            echo "EDUCORE_DB_USERNAME=educore_user"
            echo "EDUCORE_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "EDUCORE_DB_APP_USERNAME=educore_app"
            echo "EDUCORE_DB_APP_PASSWORD=$(openssl rand -hex 24)"
            echo "EDUCORE_JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "EDUCORE_LOGIN_PEPPER=$(openssl rand -base64 48 | tr -d '\n')"
            echo "EDUCORE_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')"
          } > .env

      # dev profile with its synthetic seed; the browser reaches the API through the frontend's /api proxy on :3000.
      # The frontend image prerenders its public pages from the mock catalog (docker-compose.yml build args).
      # The backend runs as uid 10001; the bind-mounted ingestion folders must be writable for it
      # (docker-compose.yml, csv_uploads volume comment).
      - name: Prepare the ingestion folders
        run: |
          mkdir -p csv_uploads/inbox csv_uploads/processing csv_uploads/done csv_uploads/failed csv_uploads/staging
          sudo chown -R 10001:10001 csv_uploads

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          npm ci --no-fund
          if node -e "process.exit(require('./package.json').scripts?.['test:e2e'] ? 0 : 1)"; then
            npx playwright install --with-deps chromium
            npm run test:e2e
          else
            echo "No test:e2e script in frontend/package.json yet; end-to-end tests skipped"
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: |
          docker compose down -v --remove-orphans
          rm -f .env

  docker:
    name: Images (build; push the backend to GHCR on tags)
    needs: [backend, frontend, attacks, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: educore-backend
            context: .
            build-args: SKIP_TESTS=true
            publish: true
          # The frontend image prerenders the public pages of ONE deployment's catalog, so it is built here with the
          # mock catalog only to prove the Dockerfile and is never pushed; deployments build it on their host.
          - image: educore-frontend
            context: frontend
            build-args: BUILD_SCRIPT=build:mock
            publish: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') && matrix.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # The backend's tests already ran in the "backend" job (and inside the image build in the security job),
      # so this build skips them. Provenance and SBOM attestations are attached to pushed images.
      - name: Build (and push on a version tag)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
