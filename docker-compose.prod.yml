# Production override: TLS edge (nginx on 80/443), prod profile, no other published port.
#
#   docker compose -f docker-compose.yml -f infra/backup/docker-compose.backup.yml -f docker-compose.prod.yml up -d
#   (add --profile certbot to obtain certificates from Let's Encrypt; docs/ops/TLS.md)
#
# or put COMPOSE_FILE=docker-compose.yml:infra/backup/docker-compose.backup.yml:docker-compose.prod.yml in .env.
# Every secret comes from .env; Compose refuses to start when a required one is missing. Documentation of
# each variable: .env.example and docs/ops/TLS.md.
#
# Exposure: only the edge publishes ports (80 -> 8080 for the ACME challenge and the HTTPS redirect,
# 443 -> 8443 for the site). PostgreSQL, the backend API port and the management port 9090 are reachable only
# inside educore-network. Resource limits, log rotation and restart policies come from docker-compose.yml.

services:
  educore-backend:
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Public origin of the site (https://host[:port]); prefixes sitemap URLs and is the allowed Origin of the
      # cookie-authenticated refresh/logout calls.
      - EDUCORE_SEO_BASE_URL=${EDUCORE_SEO_BASE_URL:?required}
      # Same-origin in production: no cross-origin browser client unless explicitly listed.
      - EDUCORE_CORS_ALLOWED_ORIGINS=${EDUCORE_CORS_ALLOWED_ORIGINS:-}
      # The edge nginx's fixed address on educore-network; the only peer whose X-Forwarded-* is honoured.
      # Without it every request would be refused with 403 request/https-required.
      - EDUCORE_IPACCESS_TRUSTED_PROXIES=172.30.42.10
      - EDUCORE_BOOTSTRAP_ADMIN_USERNAME=${EDUCORE_BOOTSTRAP_ADMIN_USERNAME:?required}
      - EDUCORE_BOOTSTRAP_ADMIN_PASSWORD=${EDUCORE_BOOTSTRAP_ADMIN_PASSWORD:?required}

  educore-frontend:
    # Same Dockerfile as development (static build + unprivileged nginx); the production configuration is mounted.
    # The public pages are prerendered from the REAL public API: BUILD_SCRIPT is fixed to `build`, which fails
    # when the API is unreachable or has no published course, so an empty or mock catalog never ships. The build
    # reaches the API through the running site (host network); the first installation is bootstrapped as
    # described in docs/ops/TLS.md ("First installation").
    build:
      network: host
      args:
        BUILD_SCRIPT: build
        PUBLIC_API_URL: ${EDUCORE_PUBLIC_API_URL:-${EDUCORE_SEO_BASE_URL:?required}}
        PUBLIC_SITE_URL: ${EDUCORE_SEO_BASE_URL:?required}
    entrypoint: ["/bin/sh", "/etc/nginx/edge-start.sh"]
    ports: !override
      - "${EDUCORE_HTTP_PORT:-80}:8080"
      - "${EDUCORE_HTTPS_PORT:-443}:8443"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - ./infra/nginx/edge-start.sh:/etc/nginx/edge-start.sh:ro
      # Certificate source: a host directory with fullchain.pem + privkey.pem (EDUCORE_TLS_SOURCE=/path), or
      # the educore_tls volume filled by the certbot sidecar (default; requires --profile certbot).
      - ${EDUCORE_TLS_SOURCE:-educore_tls}:/etc/nginx/tls:ro
      - acme_webroot:/var/www/acme:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  certbot:
    profiles: ["certbot"]
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    container_name: educore-certbot
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/educore/certbot-entrypoint.sh"]
    environment:
      # Interpolated with an empty default so the files mode needs no ACME settings; the entrypoint
      # refuses to start without them.
      EDUCORE_TLS_DOMAINS: ${EDUCORE_TLS_DOMAINS:-}
      EDUCORE_ACME_EMAIL: ${EDUCORE_ACME_EMAIL:-}
      EDUCORE_ACME_STAGING: ${EDUCORE_ACME_STAGING:-false}
    volumes:
      - ./infra/nginx/certbot/certbot-entrypoint.sh:/opt/educore/certbot-entrypoint.sh:ro
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/acme
      - educore_tls:/tls
    networks:
      - educore-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  educore_tls:
    name: educore_tls
  acme_webroot:
  letsencrypt:
