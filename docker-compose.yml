# Secrets and connection settings are read from the .env file next to this
# compose file (Compose loads it automatically). Copy .env.example to .env first.
#
# Guardrails (docs/ops/COST_GUARDRAILS.md): every service has CPU/memory limits and rotated
# json-file logs (3 x 10 MB per container). Backups: infra/backup/docker-compose.backup.yml.
#
# Exposure: only the frontend (nginx, host port 3000) is published. The browser reaches the API through
# nginx's same-origin /api/ proxy; PostgreSQL and the backend are reachable only inside the compose network.
# For local tooling, docker-compose.dev.yml publishes both on 127.0.0.1 only:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Network: fixed subnet so the backend can trust exactly one reverse proxy. nginx has the static
# address 172.30.42.10 (outside the dynamic ip_range); EDUCORE_IPACCESS_TRUSTED_PROXIES lists only it,
# so X-Forwarded-For is honoured from nginx and ignored from every other peer.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres-db:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    container_name: educore-postgres
    restart: always
    environment:
      # Bootstrap superuser and schema owner: Flyway migrates as it, the backup sidecar dumps as it.
      POSTGRES_USER: ${EDUCORE_DB_USERNAME:?required}
      POSTGRES_PASSWORD: ${EDUCORE_DB_PASSWORD:?required}
      POSTGRES_DB: ${EDUCORE_DB_NAME:?required}
      # Least-privilege runtime role of the backend (DML only), created on the first start by
      # infra/postgres/init/01-roles.sh; an existing database is upgraded by hand (docs/ops/UPGRADE.md).
      EDUCORE_DB_APP_USERNAME: ${EDUCORE_DB_APP_USERNAME:?required}
      EDUCORE_DB_APP_PASSWORD: ${EDUCORE_DB_APP_PASSWORD:?required}
    # Not published; docker-compose.dev.yml binds it to 127.0.0.1:5432 for local tools.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/app-role.sql:/opt/educore/app-role.sql:ro
    networks:
      - educore-network
    # Veritabanının hazır olup olmadığını kontrol ediyoruz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging: *default-logging

  educore-backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Local builds skip tests: the integration tests need a Docker socket inside the build
        # (see the Dockerfile header and docs/ops/CI.md); CI builds this image with tests.
        SKIP_TESTS: "true"
    container_name: educore-app
    # Restart after a crash or -XX:+ExitOnOutOfMemoryError (docs/ops/COST_GUARDRAILS.md).
    restart: unless-stopped
    # Not published: the API is served through the frontend's /api/ proxy (host :3000);
    # docker-compose.dev.yml binds it to 127.0.0.1:8081 for local tools. The Actuator management port
    # (9090) is never published; reach it with `docker compose exec` or from another service.
    environment:
      - TZ=Europe/Istanbul  # <--- BURAYA DA EKLENMELİ
      # dev (default) applies the synthetic demo seed; prod requires the bootstrap admin variables.
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      # Inside the compose network the database host is the postgres-db service.
      - EDUCORE_DB_URL=jdbc:postgresql://postgres-db:5432/${EDUCORE_DB_NAME:?required}
      # The connection pool uses the least-privilege runtime role; only Flyway connects as the owner.
      - EDUCORE_DB_APP_USERNAME=${EDUCORE_DB_APP_USERNAME:?required}
      - EDUCORE_DB_APP_PASSWORD=${EDUCORE_DB_APP_PASSWORD:?required}
      - EDUCORE_DB_MIGRATION_USERNAME=${EDUCORE_DB_USERNAME:?required}
      - EDUCORE_DB_MIGRATION_PASSWORD=${EDUCORE_DB_PASSWORD:?required}
      # Append-only erasure ledger on its own volume, which a database restore never rewinds
      # (docs/ops/BACKUP_RESTORE.md, "Erasure ledger").
      - EDUCORE_ERASURE_LEDGER_FILE=/var/lib/educore/erasure-ledger.log
      - EDUCORE_JWT_SECRET=${EDUCORE_JWT_SECRET:?required}
      # Set only during a JWT key rotation (docs/security/KEY_ROTATION.md); empty otherwise.
      - EDUCORE_JWT_SECRET_PREVIOUS=${EDUCORE_JWT_SECRET_PREVIOUS:-}
      # HMAC pepper for login throttling records; prod refuses to start without it.
      - EDUCORE_LOGIN_PEPPER=${EDUCORE_LOGIN_PEPPER:?required}
      # AES-256 key (base64 of 32 bytes) for webhook secrets at rest; prod refuses to start without it.
      - EDUCORE_ENCRYPTION_KEY=${EDUCORE_ENCRYPTION_KEY:?required}
      # The compose frontend proxies /api same-origin (frontend/nginx.conf), so browsers no longer call
      # host :8081 cross-origin; this setting only matters for other origins such as a Vite dev server.
      - EDUCORE_CORS_ALLOWED_ORIGINS=${EDUCORE_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - EDUCORE_BOOTSTRAP_ADMIN_USERNAME=${EDUCORE_BOOTSTRAP_ADMIN_USERNAME:-}
      - EDUCORE_BOOTSTRAP_ADMIN_PASSWORD=${EDUCORE_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Only the nginx container may set X-Forwarded-For (its fixed address on educore-network).
      - EDUCORE_IPACCESS_TRUSTED_PROXIES=172.30.42.10
    depends_on:
      postgres-db:
        condition: service_healthy
    # The image runs as uid 10001. Docker Desktop bind mounts are writable as-is; on a Linux host
    # make the folder writable first: sudo chown -R 10001:10001 csv_uploads
    volumes:
      - ./csv_uploads:/app/csv_uploads
      - ./csv_uploads:/csv_uploads
      - erasure_ledger:/var/lib/educore
    networks:
      - educore-network
    # Liveness through the internal management port (busybox wget ships with the Alpine JRE image).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging: *default-logging

  educore-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The public pages are prerendered at build time. Local builds use the bundled mock catalog because the
        # backend does not exist yet when the image is built; docker-compose.prod.yml builds from the real
        # public API instead (docs/ops/CI.md, "Frontend builds").
        BUILD_SCRIPT: build:mock
        PUBLIC_SITE_URL: http://localhost:3000
    container_name: educore-frontend
    restart: unless-stopped
    # nginx runs unprivileged on container port 8080, serves the static build and proxies /api/ to
    # educore-backend:8080 inside the compose network. The only published port.
    ports:
      - "3000:8080"
    depends_on:
      - educore-backend
    networks:
      educore-network:
        # Must match EDUCORE_IPACCESS_TRUSTED_PROXIES of educore-backend.
        ipv4_address: 172.30.42.10
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging: *default-logging

networks:
  educore-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.42.0/24
          # Dynamic addresses come from the upper half; static ones (nginx) live below it.
          ip_range: 172.30.42.128/25
          gateway: 172.30.42.1

volumes:
  pgdata:
  erasure_ledger:
    # Fixed name so scripts/backup/restore.sh (post-restore replay) finds it regardless of the project name.
    name: educore_erasure_ledger
