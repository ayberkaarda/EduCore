openapi: 3.1.0
info:
  description: "Course catalog, enrollment, account administration, CSV ingestion\
    \ and webhooks. Errors are RFC 9457 problem details (application/problem+json).\
    \ Authenticate with POST /api/v1/auth/login and send the access token as 'Authorization:\
    \ Bearer <token>'."
  title: EduCore API
  version: v1
servers:
- description: Same origin as the web application
  url: /
security:
- bearerAuth: []
paths:
  /api/v1/admin/accounts:
    get:
      operationId: searchAccounts
      parameters:
      - in: query
        name: search
        required: false
        schema:
          type: string
          default: ""
          maxLength: 100
          minLength: 0
          pattern: "^[^\\p{Cc}\\p{Cf}\\p{Zl}\\p{Zp}\\p{Cs}]*$"
      - in: query
        name: deleted
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 10
          maximum: 100
          minimum: 1
      - in: query
        name: sort
        required: false
        schema:
          type: string
      - in: query
        name: direction
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAccountResponse"
          description: OK
      tags:
      - account-admin-controller
  /api/v1/admin/accounts/students:
