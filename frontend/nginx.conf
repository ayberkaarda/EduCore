# EduCore frontend: static React Router build (dist/client) plus a same-origin proxy for /api.
# Security headers (CSP, HSTS, frame and referrer policies) are added by the perimeter phase.
# Access log without query strings or credentials (AC-14): the path is the request URI cut at '?', the referer
# is cut at '?' as well, and the only request header logged is User-Agent (never Authorization, Cookie or
# Set-Cookie). One JSON object per line (escape=json). Query strings may still appear in the error log, which
# nginx writes for failures only; the API carries no secret in a query string (hard delete takes a POST body).
map $request_uri $educore_log_path {
    default "";
    "~^(?<educore_log_path_only>[^?]*)" $educore_log_path_only;
}
map $http_referer $educore_log_referer {
    default "";
    "~^(?<educore_log_referer_only>[^?#]*)" $educore_log_referer_only;
}
log_format educore_access escape=json
    '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method","path":"$educore_log_path",'
    '"protocol":"$server_protocol","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
    '"referer":"$educore_log_referer","userAgent":"$http_user_agent"}';

server {
    # The image runs nginx as an unprivileged user, so it listens on 8080 (compose maps host 3000 to it).
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log educore_access;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml
               application/manifest+json image/svg+xml;

    # API: same-origin proxy to the backend's API port, so the browser uses the default base URL /api
    # and needs no CORS. The Actuator management port (9090) is never proxied or published.
    # Resolving through Docker's embedded DNS at request time lets nginx start before the backend.
    # ^~ stops regex locations (such as the .html rule below) from capturing API paths.
    # nginx is the edge: it OVERWRITES the forwarding headers with its own view instead of appending to
    # whatever the client sent, so a spoofed X-Forwarded-For never reaches the backend. The backend trusts
    # these headers only from this container (EDUCORE_IPACCESS_TRUSTED_PROXIES in docker-compose.yml).
    location ^~ /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $educore_backend http://educore-backend:8080;
        proxy_pass $educore_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";
        # CSV uploads pass through; the backend enforces its own multipart limits.
        client_max_body_size 10m;
    }

    # Content-hashed build output (including the externalized inline-<sha256>.js files): cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Prerendered landing page.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Client-rendered application: every path under /app that is not a file gets the SPA shell.
    location = /app {
        add_header Cache-Control "no-cache" always;
        try_files /__spa-fallback.html =404;
    }
    location /app/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri /__spa-fallback.html;
    }

    # HTML is always revalidated so a deploy is picked up immediately.
    location ~ \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Sitemaps: generated by the backend; when it cannot answer, the build's sitemap-static.xml is served.
    location = /sitemap.xml {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $educore_backend http://educore-backend:8080;
        proxy_pass $educore_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @static_sitemap;
    }
    location ~ ^/sitemap-courses-[0-9]+\.xml$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $educore_backend http://educore-backend:8080;
        proxy_pass $educore_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @static_sitemap {
        try_files /sitemap-static.xml =404;
    }

    # English public pages: their own not-found page.
    location ^~ /en/ {
        try_files $uri $uri/index.html =404;
        error_page 404 /en/404.html;
    }

    # Other public files and prerendered routes (<route>/index.html). Unknown public paths answer 404 with
    # the prerendered not-found page; only /app/** uses the SPA shell.
    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;
}
