# EduCore production edge (mounted as /etc/nginx/conf.d/default.conf by docker-compose.prod.yml).
# TLS termination, HTTP -> HTTPS, security headers, static SPA (React Router build in /usr/share/nginx/html)
# and the same-origin /api/ proxy. Header values: docs/security/HEADERS.md. Operations: docs/ops/TLS.md.
# The image runs nginx unprivileged (uid 101): it listens on 8080 (published as 80) and 8443 (published as 443).

# Access log without query strings or credentials (AC-14): the path is the request URI cut at '?', the referer
# is cut at '?' as well, and the only request header logged is User-Agent (never Authorization, Cookie or
# Set-Cookie). One JSON object per line (escape=json). Query strings may still appear in the error log, which
# nginx writes for failures only; the API carries no secret in a query string (hard delete takes a POST body).
map $request_uri $educore_log_path {
    default "";
    "~^(?<educore_log_path_only>[^?]*)" $educore_log_path_only;
}
map $http_referer $educore_log_referer {
    default "";
    "~^(?<educore_log_referer_only>[^?#]*)" $educore_log_referer_only;
}
log_format educore_access escape=json
    '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method","path":"$educore_log_path",'
    '"protocol":"$server_protocol","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
    '"referer":"$educore_log_referer","userAgent":"$http_user_agent"}';

server_tokens off;

# Docker's embedded DNS; the upstream below is re-resolved, so nginx starts before the backend exists and
# follows a recreated backend container.
resolver 127.0.0.11 valid=30s ipv6=off;

upstream educore_api {
    zone educore_api 64k;
    server educore-backend:8080 resolve;
    keepalive 16;
}

# Public HTTPS port as the browser sees it: taken from the Host header when it carries one (a non-default
# published port such as EDUCORE_HTTPS_PORT=8443), else 443. Sent as X-Forwarded-Port so the backend's
# same-origin check (CORS, refresh Origin) compares against the real public origin instead of container
# port 8443. The value only affects the requesting client's own request.
map $http_host $edge_public_port {
    "~:(?<edge_port>[0-9]{1,5})$" $edge_port;
    default 443;
}

# Limits and timeouts shared by both servers. 6m matches the backend's multipart max-request-size.
client_max_body_size 6m;
client_body_timeout 30s;
client_header_timeout 15s;
send_timeout 30s;
large_client_header_buffers 4 16k;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json application/problem+json
           application/xml application/manifest+json image/svg+xml;

# Plain HTTP: only the ACME challenge and the container healthcheck are answered; everything else is a 301 to
# HTTPS. No HSTS here: browsers ignore it on insecure responses (RFC 6797, section 7.2).
server {
    listen 8080 default_server;
    server_name _;
    access_log /var/log/nginx/access.log educore_access;
    # The image's nginx.conf sets keepalive_timeout 65 at http level; edge connections are kept shorter.
    keepalive_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTTP-01 challenges written by the certbot sidecar (docker-compose.prod.yml, profile "certbot").
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    access_log /var/log/nginx/access.log educore_access;
    # The image's nginx.conf sets keepalive_timeout 65 at http level; edge connections are kept shorter.
    keepalive_timeout 30s;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/tls-params.conf;
    include /etc/nginx/snippets/spa-security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API. ^~ keeps regex locations (the .html rule) from capturing API paths. X-Robots-Tag is set here
    # (and hidden from the upstream) so that nginx-generated errors are noindex too, without duplicates.
    location ^~ /api/ {
        include /etc/nginx/snippets/proxy-to-backend.conf;
        include /etc/nginx/snippets/api-security-headers.conf;
        proxy_hide_header X-Robots-Tag;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Sitemaps are generated by the backend; when it cannot answer, the build's sitemap-static.xml (both
    # languages, written by the frontend build) is served instead.
    location = /sitemap.xml {
        include /etc/nginx/snippets/proxy-to-backend.conf;
        include /etc/nginx/snippets/api-security-headers.conf;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @static_sitemap;
    }
    location ~ ^/sitemap-[a-z0-9-]+\.xml$ {
        include /etc/nginx/snippets/proxy-to-backend.conf;
        include /etc/nginx/snippets/api-security-headers.conf;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @static_sitemap;
    }
    # The build's own sitemap of the prerendered pages (both languages) is always static.
    location = /sitemap-static.xml {
        include /etc/nginx/snippets/spa-security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }
    location @static_sitemap {
        include /etc/nginx/snippets/spa-security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files /sitemap-static.xml =404;
    }

    # Crawler policy files from the static build.
    location = /robots.txt {
        include /etc/nginx/snippets/spa-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }
    location ~ ^/llms(-full)?\.txt$ {
        include /etc/nginx/snippets/spa-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Content-hashed build output (including the externalized inline-<sha256>.js files): cache forever.
    location ^~ /assets/ {
        include /etc/nginx/snippets/spa-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Prerendered landing page.
    location = / {
        include /etc/nginx/snippets/spa-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Client-rendered application: never indexed (this header plus the page's robots meta tag); every path
    # under /app that is not a file gets the SPA shell.
    location = /app {
        include /etc/nginx/snippets/spa-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /__spa-fallback.html =404;
    }
    location ^~ /app/ {
        include /etc/nginx/snippets/spa-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri @app_shell;
    }
    # Serves the shell without an internal redirect to the .html location, so the /app headers stay.
    location @app_shell {
        include /etc/nginx/snippets/spa-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        rewrite ^ /__spa-fallback.html break;
    }

    # HTML is always revalidated so a deploy is picked up immediately.
    location ~ \.html$ {
        include /etc/nginx/snippets/spa-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # English public pages (prerendered under /en): unknown paths get the English not-found page.
    location ^~ /en/ {
        include /etc/nginx/snippets/spa-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
        error_page 404 /en/404.html;
    }

    # Other public files and prerendered routes (<route>/index.html). Unknown paths (including /nginx_status:
    # no status endpoint is configured) answer 404 with the prerendered not-found page (/404.html); only
    # /app/** falls back to the SPA shell.
    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;
}
