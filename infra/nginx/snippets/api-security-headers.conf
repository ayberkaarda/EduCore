# Security headers for responses of the API (and the backend-generated sitemaps).
# The backend already sends exactly these values (docs/security/HEADERS.md, "API response headers"). nginx
# hides the upstream copies and sets the same values itself with `always`, so that
#   - responses nginx generates on this path (413 body too large, 502/504 backend unavailable) carry them too,
#   - no header is ever duplicated (duplicates would combine two CSPs or invalidate X-Frame-Options).
# Cache-Control and every other upstream header pass through unchanged.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
