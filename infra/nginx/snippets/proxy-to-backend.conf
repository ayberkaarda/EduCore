# Reverse proxy to the backend API port (never the management port 9090).
# nginx is the edge: it OVERWRITES the forwarding headers with its own view of the connection instead of
# appending to client-supplied values. The backend honours them only from the nginx address listed in
# EDUCORE_IPACCESS_TRUSTED_PROXIES, and derives the client IP (rate limits, login throttling, IP deny rules,
# audit) and the secure flag (HTTPS requirement, HSTS) from them.
proxy_pass http://educore_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# The public port (nginx.prod.conf map), not the container port 8443 nginx listens on.
proxy_set_header X-Forwarded-Port $edge_public_port;
proxy_set_header Forwarded "";

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
# Bodies (CSV uploads up to client_max_body_size) are buffered by nginx, so a slow client cannot hold a
# backend thread; responses are buffered so the backend is released as soon as it has answered.
proxy_request_buffering on;
proxy_buffering on;
# 429 Retry-After, ETag and X-Request-Id pass through unchanged; never retry a non-idempotent request.
proxy_next_upstream error timeout;
proxy_next_upstream_tries 1;
