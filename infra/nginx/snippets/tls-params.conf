# TLS settings (Mozilla "intermediate" profile: TLS 1.2 + 1.3, forward-secret AEAD ciphers only).
# Certificate files: /etc/nginx/tls/{fullchain,privkey}.pem, from a host directory or the certbot sidecar
# (docs/ops/TLS.md).
ssl_certificate     /etc/nginx/tls/fullchain.pem;
ssl_certificate_key /etc/nginx/tls/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_ecdh_curve X25519:prime256v1:secp384r1;

ssl_session_cache shared:EduCoreTLS:10m;
ssl_session_timeout 1d;
# Session tickets would let a stolen ticket key decrypt past sessions; the session cache covers resumption.
ssl_session_tickets off;

# OCSP stapling where the certificate carries an OCSP responder URL (self-signed and OCSP-less certificates
# log a warning and are served without a staple).
ssl_stapling on;
ssl_stapling_verify on;
ssl_trusted_certificate /etc/nginx/tls/fullchain.pem;
