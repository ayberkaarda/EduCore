# Production profile. No secret has a default here: every value below must come from the environment.
# ProdStartupGuard refuses to start and names each missing variable before any bean is created.

spring:
  flyway:
    # A database first used under dev/test has the repeatable dev seed (R__dev_seed) in its history, which
    # the prod locations do not contain. Ignore only that case ("repeatable:missing"); "*:future" is
    # Flyway's own default and is kept. Versioned migrations that go missing still fail validation.
    ignore-migration-patterns: "*:future,repeatable:missing"
  datasource:
    url: ${EDUCORE_DB_URL}
    username: ${EDUCORE_DB_USERNAME}
    password: ${EDUCORE_DB_PASSWORD}

educore:
  security:
    jwt:
      secret: ${EDUCORE_JWT_SECRET}
    login:
      username-pepper: ${EDUCORE_LOGIN_PEPPER}
  cors:
    # Empty by default: in production the SPA and the API share one origin behind the reverse proxy.
    allowed-origins: ${EDUCORE_CORS_ALLOWED_ORIGINS:}
  bootstrap:
    admin:
      # The first ADMIN is created from these when no ADMIN exists; it must change its password.
      username: ${EDUCORE_BOOTSTRAP_ADMIN_USERNAME}
      password: ${EDUCORE_BOOTSTRAP_ADMIN_PASSWORD}
