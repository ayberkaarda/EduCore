# Base configuration shared by every profile.
# Profile-specific overrides: application-dev.yml, application-test.yml, application-prod.yml.
# The active profile comes from SPRING_PROFILES_ACTIVE; without it the 'dev' profile is used.
# Secrets and connection details are read from environment variables documented in .env.example.

spring:
  application:
    name: educore
  profiles:
    default: dev

  datasource:
    url: ${EDUCORE_DB_URL}
    username: ${EDUCORE_DB_USERNAME}
    password: ${EDUCORE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing databases created before Flyway (schema built by Hibernate ddl-auto=update, Batch tables
    # possibly created by spring.batch.jdbc.initialize-schema=always) already contain the V1 application
    # tables. baseline-on-migrate records such a non-empty schema at baseline-version 1 instead of failing;
    # V2 (CREATE ... IF NOT EXISTS) then adds any missing Spring Batch table and V4+ run as usual.
    # Fresh, empty databases are unaffected and run V1+.
    baseline-on-migrate: true
    baseline-version: 1

  batch:
    jdbc:
      # Spring Batch tables are created by Flyway (V2__spring_batch_schema.sql).
      initialize-schema: never
    job:
      enabled: false

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Actuator is served on its own port (not published by docker-compose).
# /actuator/health is open; every other endpoint requires an ADMIN token (see SecurityConfig).
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN

educore:
  security:
    jwt:
      # Base64, at least 32 decoded bytes; JwtService fails startup with a clear message otherwise.
      secret: ${EDUCORE_JWT_SECRET:}
      # Optional: the secret that was current before the last rotation. Tokens signed with it stay valid
      # until they expire; new tokens are always signed with the current secret (docs/security/KEY_ROTATION.md).
      previous-secret: ${EDUCORE_JWT_SECRET_PREVIOUS:}
      issuer: educore
      audience: educore-api
      access-token-ttl: 15m
    login:
      # Key for HMAC-SHA-256 of usernames stored in login_attempt. Required in prod; outside prod a random
      # per-process value is used when unset (lockout counters then reset on restart).
      username-pepper: ${EDUCORE_LOGIN_PEPPER:}
      ip-attempts-per-minute: 10
      max-failures: 5
      lock-duration: 15m
    refresh-token:
      ttl: 14d
      # The refresh cookie is Secure everywhere except the dev profile (plain HTTP on localhost).
      cookie-secure: true
  # Other educore.* settings have defaults in EduCoreProperties. Environment variables bind by name,
  # e.g. EDUCORE_CORS_ALLOWED_ORIGINS -> educore.cors.allowed-origins and
  # EDUCORE_BOOTSTRAP_ADMIN_USERNAME / _PASSWORD -> educore.bootstrap.admin.username / password.
