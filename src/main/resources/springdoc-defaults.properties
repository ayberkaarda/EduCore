# Lowest-precedence defaults loaded by com.educore.config.OpenApiConfig: the OpenAPI document and Swagger UI
# are off unless a profile (application-dev.yml) or an explicit property turns them on.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.writer-with-order-by-keys=true
springdoc.paths-to-match=/api/**,/sitemap.xml,/sitemap-courses-*.xml
