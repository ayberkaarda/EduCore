# OWASP ZAP baseline rules for EduCore (scripts/zap-local.sh, .github/workflows/zap.yml).
# Format: rule id<TAB>action<TAB>(name) and justification. Actions: FAIL fails the scan, WARN is reported,
# IGNORE is not reported. Rules not listed default to WARN. Any High-risk alert fails the scan regardless
# of this file (scripts/zap-local.sh counts riskcode 3 in the JSON report).
# FAIL: guarantees the edge and the API already provide (docs/security/HEADERS.md); a regression must fail.
# IGNORE: informational rules only, each with the reason. WARN: findings that need a human decision.
10003	FAIL	(Vulnerable JS Library (Powered by Retire.js)) Known-vulnerable JavaScript library shipped to browsers.
10009	WARN	(In Page Banner Information Leak)
10010	FAIL	(Cookie No HttpOnly Flag) Refresh cookie must be HttpOnly (P2).
10011	FAIL	(Cookie Without Secure Flag) Refresh cookie must be Secure outside dev (P2).
10015	WARN	(Re-examine Cache-control Directives)
10017	WARN	(Cross-Domain JavaScript Source File Inclusion)
10019	WARN	(Content-Type Header Missing)
10020	FAIL	(Anti-clickjacking Header) X-Frame-Options DENY is set on every response (HEADERS.md).
10021	FAIL	(X-Content-Type-Options Header Missing) nosniff is set on every response (HEADERS.md).
10023	FAIL	(Information Disclosure - Debug Error Messages) Debug error messages would leak internals; problem details never include them (P4).
10024	WARN	(Information Disclosure - Sensitive Information in URL)
10025	WARN	(Information Disclosure - Sensitive Information in HTTP Referrer Header)
10026	WARN	(HTTP Parameter Override)
10027	WARN	(Information Disclosure - Suspicious Comments) Suspicious comments in bundled code need human review, not an automatic failure.
10028	WARN	(Off-site Redirect)
10029	WARN	(Cookie Poisoning)
10030	WARN	(User Controllable Charset)
10031	WARN	(User Controllable HTML Element Attribute (Potential XSS))
10032	WARN	(Viewstate)
10033	WARN	(Directory Browsing)
10034	WARN	(Heartbleed OpenSSL Vulnerability (Indicative))
10035	FAIL	(Strict-Transport-Security Header) HSTS is set on every HTTPS response (HEADERS.md).
10036	FAIL	(HTTP Server Response Header) server_tokens off; no version in Server.
10037	FAIL	(Server Leaks Information via "X-Powered-By" HTTP Response Header Field(s)) No X-Powered-By header may leak the stack.
10038	FAIL	(Content Security Policy (CSP) Header Not Set) CSP is set on every response (HEADERS.md).
10039	FAIL	(X-Backend-Server Header Information Leak) No backend server header may leak.
10040	FAIL	(Secure Pages Include Mixed Content) Mixed content would undo TLS.
10041	WARN	(HTTP to HTTPS Insecure Transition in Form Post)
10042	WARN	(HTTPS to HTTP Insecure Transition in Form Post)
10043	WARN	(User Controllable JavaScript Event (XSS))
10044	WARN	(Big Redirect Detected (Potential Sensitive Information Leak))
10049	IGNORE	(Content Cacheability) Content Cacheability is informational; the cache policy (immutable hashed assets, no-cache HTML, API no-store) is deliberate (docs/ops/TLS.md).
10050	IGNORE	(Retrieved from Cache) Retrieved from Cache is informational and depends on intermediaries, not on EduCore.
10052	WARN	(X-ChromeLogger-Data (XCOLD) Header Information Leak)
10054	FAIL	(Cookie without SameSite Attribute) Refresh cookie is SameSite=Strict (P2).
10055	FAIL	(CSP) The SPA and API CSPs are strict (no unsafe-inline scripts); any weakening must fail.
10056	FAIL	(X-Debug-Token Information Leak) No debug token header may leak.
10057	WARN	(Username Hash Found)
10061	FAIL	(X-AspNet-Version Response Header) Not an ASP.NET stack; any such header is a leak.
10062	FAIL	(PII Disclosure) PII must never appear in public responses.
10063	FAIL	(Permissions Policy Header Not Set) Permissions-Policy is set on every response (HEADERS.md).
10096	IGNORE	(Timestamp Disclosure) Timestamp Disclosure matches epoch-like numbers in hashed asset names and public JSON (course timestamps are public data).
10097	WARN	(Hash Disclosure)
10098	FAIL	(Cross-Domain Misconfiguration) CORS is a strict allow-list (HEADERS.md); a wildcard must fail.
10099	WARN	(Source Code Disclosure) WARN, not FAIL: the passive SQL pattern matches English prose on the public pages ("select their term courses from their profile" on /en, 2026-10-02 scan). Server-side code and SQL never reach responses: problem details carry no exception text (ProblemDetailsIT). Review every new instance.
10105	WARN	(Weak Authentication Method)
10108	WARN	(Reverse Tabnabbing)
10109	IGNORE	(Modern Web Application) Modern Web Application is informational (the SPA is a modern web application by design).
10110	WARN	(Dangerous JS Functions)
10111	IGNORE	(Authentication Request Identified) Authentication Request Identified is informational (login is expected to exist).
10112	IGNORE	(Session Management Response Identified) Session Management Response Identified is informational.
10113	IGNORE	(Verification Request Identified) Verification Request Identified is informational.
10115	FAIL	(Script Served From Malicious Domain (polyfill)) Scripts are self-hosted only.
10116	IGNORE	(ZAP is Out of Date) ZAP is Out of Date: the image is pinned by digest on purpose and updated deliberately (docs/ops/CI.md).
10202	WARN	(Absence of Anti-CSRF Tokens) The API uses bearer tokens and the cookie endpoints verify Origin (OriginVerifier) instead of CSRF tokens; review any new form.
